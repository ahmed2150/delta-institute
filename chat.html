<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الشات - معهد الدلتا</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <header class="main-header">
    <div class="header-content">
      <img src="assets/logo.png" alt="شعار المعهد" class="header-logo">
      <div class="header-title">
        <h1>معهد الدلتا العالي</h1>
        <p>لنظم المعلومات الإدارية والمحاسبية - المنصورة</p>
      </div>
    </div>
  </header>

  <div class="dashboard">
    <div class="page-title">
      <span>💬 الشات</span>
      <span class="user-welcome" id="userName"></span>
      <button class="btn-logout" onclick="goBack()">🔙 رجوع</button>
    </div>

    <div class="chat-layout">
      <div class="chat-sidebar">
        <div class="chat-sidebar-header">
          <h3>💬 المحادثات</h3>
          <button class="btn-new-chat" onclick="openNewChatModal()">+</button>
        </div>
        <div class="chat-search">
          <input type="text" id="chatSearch" placeholder="🔍 ابحث..." oninput="filterChats()">
        </div>
        <div class="chat-list" id="chatList"></div>
      </div>

      <div class="chat-main" id="chatMain">
        <div class="chat-empty">
          <div class="icon">💬</div>
          <p>اختر محادثة أو ابدأ محادثة جديدة</p>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="newChatModal">
    <div class="modal">
      <h3>👥 اختر مستخدماً</h3>
      <input type="text" id="userSearch" placeholder="🔍 ابحث بالاسم..." oninput="filterUsers()">
      <div class="users-list" id="usersList"></div>
      <button class="modal-close" onclick="closeNewChatModal()">إغلاق</button>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
